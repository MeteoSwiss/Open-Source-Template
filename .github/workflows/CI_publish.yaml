# This workflow will build and publish the Python package to PyPi and the documentation to the `gh-pages` branch of the
# repository when a version tag (X.Y.Z) is added.
# It uses `pypa/gh-action-pypi-publish@release/v1` to publish to pypi using trusted publishers feature.
# The documentation of the release is added to the `gh-pages` branch as folder `X.Y.Z`; the version switcher
# configuration and the `stable` folder are then regenerated from the version folders found there.
#
# Copyright (c) 2025 MeteoSwiss, created by Michele Cattaneo; michele.cattaneo@meteoswiss.ch

name: CI_publish

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

jobs:

  tests:
    uses: ./.github/workflows/CI_test.yaml

  publish:
    runs-on: ubuntu-latest
    needs: tests
    # Serialize all deployments to the gh-pages branch
    concurrency:
      group: gh-pages
      cancel-in-progress: false

    permissions:
      id-token: write
      contents: write
      pages: write

    steps:
    - name: Checkout current repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: 3.12

    - name: Install poetry and python package
      run: |
        python -m pip install --upgrade pip
        python -m pip install poetry
        poetry install

    - name: Build artifacts
      run: |
        poetry version ${GITHUB_REF#refs/tags/}
        poetry build

    - name: Publish to PyPi
      # Skipped in forks, which have no trusted publisher on PyPI, so the release can be tested there
      if: github.repository_owner == 'MeteoSwiss'
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist/

    - name: Build documentation
      env:
        VERSION: ${{ github.ref_name }}
        # use the switcher config from main to show all the versions (past and future)
        VERSION_SWITCHER_CONFIG_URL: ../_static/switcher_config.json
        GITHUB_SHA: ${{ github.sha }}
      # Set the buildId to the first 7 digits of the commit hash
      run: BUILD_ID=$(echo ${GITHUB_SHA::7}) poetry run sphinx-build doc doc/_build/${{ github.ref_name }}

    - name: Checkout documentation site
      uses: actions/checkout@v4
      with:
        ref: gh-pages
        path: gh-pages

    - name: Publish documentation
      env:
        VERSION: ${{ github.ref_name }}
      run: |
        rm --recursive --force "gh-pages/${VERSION}"
        cp --recursive "doc/_build/${VERSION}" gh-pages/
        python .github/scripts/update_version_index.py gh-pages --base-url "/${{ github.event.repository.name }}/"
        git -C gh-pages config user.name "github-actions[bot]"
        git -C gh-pages config user.email "41898232+github-actions[bot]@users.noreply.github.com"
        git -C gh-pages add --all
        git -C gh-pages diff --cached --quiet || git -C gh-pages commit --message "deploy: ${GITHUB_SHA}"
        git -C gh-pages push
