# Releases a version tag X.Y.Z: runs CI with the tag as version, publishes the package that CI built to PyPI, then
# publishes the documentation that CI built to folder X.Y.Z of the gh-pages branch.
#
# Copyright (c) 2025 MeteoSwiss, created by Michele Cattaneo; michele.cattaneo@meteoswiss.ch

name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  # Must differ from the group ci.yml builds from github.workflow, which is "Release" when called from here
  group: release-caller-${{ github.ref }}
  cancel-in-progress: false

jobs:

  ci:
    name: CI
    uses: $/.github/workflows/ci.yml
    with:
      version: ${{ github.ref_name }}
    permissions:
      # A called workflow can't request more than its caller grants. The dev docs job of ci.yml requests write access
      # and is skipped for tags, but the workflow fails to start without this grant.
      contents: write  # for the dev docs job of ci.yml, skipped for tags

  pypi:
    name: Publish to PyPI
    needs: ci
    # Forks have no trusted publisher on PyPI; skipping the upload there keeps the release testable in a fork
    if: github.repository_owner == 'MeteoSwiss'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing
    steps:
      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  deploy-docs:
    name: Deploy release docs
    needs: [ci, pypi]
    # A skipped pypi job (in a fork) would skip this job too; failure() covers failed ci and pypi jobs
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # push to the gh-pages branch
    # Serializes all pushes to the gh-pages branch
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download documentation
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs
          path: site

      - name: Publish documentation
        uses: $/.github/actions/publish-docs
        with:
          site-dir: site
          folder: ${{ github.ref_name }}
